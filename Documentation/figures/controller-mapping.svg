<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="570" rx="16" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#18181b">Kontrolloppsett</text>

  <g transform="translate(50,60)">
    <!-- Body -->
    <path d="M260 150 C320 120,580 120,640 150 C720 170,760 260,790 390 C805 460,760 490,720 460 C690 430,660 390,610 380 L290 380 C240 390,210 430,180 460 C140 490,95 460,110 390 C140 260,180 170,260 150 Z"
          fill="url(#body)" stroke="#71717a" stroke-width="3"/>

    <!-- Center buttons -->
    <circle cx="450" cy="200" r="20" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="2"/>
    <circle cx="430" cy="270" r="7" fill="#a1a1aa"/>
    <circle cx="470" cy="270" r="7" fill="#a1a1aa"/>

    <!-- D-pad -->
    <g transform="translate(380,320)" fill="#a1a1aa">
      <rect x="-9" y="-27" width="18" height="54" rx="3"/>
      <rect x="-27" y="-9" width="54" height="18" rx="3"/>
    </g>

    <!-- Face buttons (neutral) -->
    <g fill="#d4d4d8" stroke="#a1a1aa" stroke-width="2">
      <circle cx="590" cy="212" r="13"/><circle cx="564" cy="238" r="13"/>
      <circle cx="616" cy="238" r="13"/><circle cx="590" cy="264" r="13"/>
    </g>

    <!-- Left stick -->
    <circle cx="320" cy="240" r="38" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="320" cy="240" r="26" fill="#3f3f46" stroke="#27272a" stroke-width="2"/>
    <!-- Surge (up/down) -->
    <line x1="320" y1="192" x2="320" y2="150" stroke="#2563eb" stroke-width="6" marker-end="url(#aBlue)"/>
    <line x1="320" y1="288" x2="320" y2="330" stroke="#2563eb" stroke-width="6" marker-end="url(#aBlue)"/>
    <!-- Sway (left/right) -->
    <line x1="272" y1="240" x2="230" y2="240" stroke="#16a34a" stroke-width="6" marker-end="url(#aGreen)"/>
    <line x1="368" y1="240" x2="410" y2="240" stroke="#16a34a" stroke-width="6" marker-end="url(#aGreen)"/>

    <!-- Right stick -->
    <circle cx="530" cy="320" r="38" fill="#52525b" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="530" cy="320" r="26" fill="#3f3f46" stroke="#27272a" stroke-width="2"/>
    <!-- Yaw CCW (left) and CW (right) -->
    <path d="M520 268 A52 52 0 0 0 482 345" fill="none" stroke="#ea580c" stroke-width="6" marker-end="url(#aOrange)"/>
    <path d="M540 268 A52 52 0 0 1 578 345" fill="none" stroke="#ea580c" stroke-width="6" marker-end="url(#aOrange)"/>
  </g>


  <!-- Inline labels -->
  <text x="384" y="238" font-size="16" font-weight="700" fill="#2563eb">Surge</text>
  <text x="270" y="290" font-size="16" font-weight="700" fill="#16a34a" text-anchor="end">Sway</text>
  <text x="510" y="430" font-size="16" font-weight="700" fill="#ea580c" text-anchor="end">↺ Yaw</text>
  <text x="650" y="430" font-size="16" font-weight="700" fill="#ea580c">Yaw ↻</text>

  <!-- Left legend -->
  <line x1="250" y1="130" x2="340" y2="268" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="20" y="70" width="240" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="100" font-size="17" font-weight="700" fill="#18181b">Venstre joystick</text>
  <text x="36" y="132" font-size="15" fill="#2563eb" font-weight="600">↑ ↓  Surge</text>
  <text x="140" y="132" font-size="14" fill="#52525b">opp / ned</text>
  <text x="36" y="164" font-size="15" fill="#16a34a" font-weight="600">← →  Sway</text>
  <text x="140" y="164" font-size="14" fill="#52525b">venstre / høyre</text>

  <!-- Right legend -->
  <line x1="860" y1="190" x2="630" y2="372" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="740" y="70" width="240" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="756" y="100" font-size="17" font-weight="700" fill="#18181b">Høyre joystick</text>
  <text x="756" y="132" font-size="15" fill="#ea580c" font-weight="600">←  Yaw ↺</text>
  <text x="850" y="132" font-size="14" fill="#52525b">mot klokka</text>
  <text x="756" y="164" font-size="15" fill="#ea580c" font-weight="600">→  Yaw ↻</text>
  <text x="850" y="164" font-size="14" fill="#52525b">med klokka</text>
</svg>
